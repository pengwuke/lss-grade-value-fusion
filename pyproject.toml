[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2-runtime-candidate"
version = "1.0.0"
description = "Paper2 inference and artifact-verification research code"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchvision", "timm", "opencv-python-headless", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
