[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2-matched-statistics-candidate"
version = "1.0.0"
description = "Paper2 frozen-input patient-cluster statistics interface"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper2_statistics = ["plans.json", "KERNEL_PROVENANCE.json"]
